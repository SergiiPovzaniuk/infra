jenkins:
  systemMessage: "Hybrid DevOps exam platform — Git Flow CI/CD"
  numExecutors: 2
  labelString: "built-in amd64 docker"
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: dockerhub
              username: ${DOCKERHUB_USERNAME}
              password: ${DOCKERHUB_TOKEN}
          - usernamePassword:
              id: ses-smtp
              username: ${SES_SMTP_USERNAME}
              password: ${SES_SMTP_PASSWORD}
          - usernamePassword:
              id: github-pat
              username: ${GITHUB_USERNAME}
              password: ${GITHUB_PAT}
              description: "GitHub PAT for multibranch"
          - usernamePassword:
              id: aws
              username: ${AWS_ACCESS_KEY_ID}
              password: ${AWS_SECRET_ACCESS_KEY}
              description: "AWS for Terraform"
          - usernamePassword:
              id: minio-tfstate
              username: ${MINIO_ACCESS_KEY}
              password: ${MINIO_SECRET_KEY}
              description: "MinIO S3 backend for Terraform state"
jobs:
  - script: >
      multibranchPipelineJob('infra') {
        displayName('infra')
        description('Terraform + Ansible k3s + NLB; triggers app-forked deploy')
        branchSources {
          git {
            id('infra-git')
            remote('https://github.com/SergiiPovzaniuk/infra.git')
            credentialsId('github-pat')
            includes('main')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            daysToKeep(14)
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
  - script: >
      multibranchPipelineJob('app-forked') {
        displayName('app-forked')
        description('Git Flow CI/CD: main develop feature/* release/* hotfix/*')
        branchSources {
          git {
            id('app-forked-git')
            remote('https://github.com/SergiiPovzaniuk/app-forked.git')
            credentialsId('github-pat')
            includes('main develop feature/* release/* hotfix/*')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            daysToKeep(14)
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
unclassified:
  location:
    url: ${JENKINS_URL}
    adminAddress: ${SES_FROM}
  mailer:
    smtpHost: ${SES_SMTP_HOST}
    smtpPort: ${SES_SMTP_PORT}
    useSsl: false
    useTls: true
    charset: UTF-8
  email-ext:
    mailAccount:
      smtpHost: ${SES_SMTP_HOST}
      smtpPort: ${SES_SMTP_PORT}
      credentialsId: ses-smtp
      useSsl: false
      useTls: true
    charset: UTF-8
    defaultContentType: text/plain
    defaultRecipients: ${SES_TO}
    defaultReplyTo: ${SES_FROM}
