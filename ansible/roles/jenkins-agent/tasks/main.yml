- ansible.builtin.debug:
    msg: "Skipping Jenkins agent join — set enable_jenkins_agent=true after CasC agent secret exists"
  when: not (enable_jenkins_agent | bool) or (jenkins_agent_secret | regex_search('replace-me'))

- when: (enable_jenkins_agent | bool) and not (jenkins_agent_secret | regex_search('replace-me'))
  block:
    - ansible.builtin.apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: true
      register: java_pkg
      failed_when: false

    - ansible.builtin.apt:
        name: default-jre-headless
        state: present
      when: java_pkg is failed

    - ansible.builtin.user:
        name: jenkins
        system: true
        create_home: true

    - ansible.builtin.get_url:
        url: "{{ jenkins_url }}/jnlpJars/agent.jar"
        dest: /opt/jenkins-agent.jar
        owner: jenkins
        group: jenkins
        mode: "0644"

    - ansible.builtin.template:
        src: jenkins-agent.service.j2
        dest: /etc/systemd/system/jenkins-agent.service
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart Jenkins agent

    - ansible.builtin.systemd:
        name: jenkins-agent
        state: started
        enabled: true
        daemon_reload: true
